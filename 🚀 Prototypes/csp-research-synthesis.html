<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSP Research Synthesis</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F8FAFC;--surface:#FFFFFF;--surface2:#F1F5F9;--border:#E2E8F0;
  --text:#0F172A;--text2:#475569;--text3:#94A3B8;
  --accent:#2563EB;--accent2:#1D4ED8;
  --high:#16A34A;--med:#D97706;--warn:#D97706;--danger:#DC2626;
  --snow:#E2251B;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;line-height:1.5}
.app{display:flex;height:100vh;overflow:hidden}

/* Sidebar */
.sidebar{width:200px;min-width:200px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 0}
.sidebar h1{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text3);padding:0 20px;margin-bottom:20px}
.nav-item{padding:10px 20px;cursor:pointer;color:var(--text2);transition:all .15s;border-left:3px solid transparent;font-size:13px}
.nav-item:hover{color:var(--text);background:var(--surface2)}
.nav-item.active{color:var(--accent);border-left-color:var(--accent);background:rgba(37,99,235,.06)}
.nav-item small{display:block;font-size:11px;color:var(--text3);margin-top:2px}

/* Main */
.main{flex:1;overflow-y:auto;padding:32px 40px}
.view{display:none}.view.active{display:block}
.view-header{margin-bottom:28px}
.view-header h2{font-size:22px;font-weight:700;margin-bottom:4px}
.view-header p{color:var(--text2);font-size:13px}

/* Brief view */
.selector{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.chip{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);color:var(--text2);transition:all .15s;background:transparent}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.mode-toggle{display:flex;gap:4px;margin-bottom:20px}
.mode-btn{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--border);color:var(--text2);background:transparent;transition:all .15s}
.mode-btn:hover{border-color:var(--accent);color:var(--accent)}
.mode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.brief-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px 24px;margin-bottom:16px}
.brief-card h3{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text)}
.brief-card h4{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:8px;margin-top:16px}
.brief-card h4:first-child{margin-top:0}
.brief-list{list-style:none}
.brief-list li{padding:6px 0;border-bottom:1px solid var(--border);color:var(--text2);font-size:13px}
.brief-list li:last-child{border:none}
.brief-list li strong{color:var(--text)}
.stat{font-size:20px;font-weight:700;color:var(--accent);display:inline}
.signal-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;text-transform:uppercase}
.signal-badge.high{background:rgba(22,163,74,.1);color:var(--high)}
.signal-badge.med{background:rgba(217,119,6,.1);color:var(--med)}
.snow-callout{background:rgba(226,37,27,.04);border:1px solid rgba(226,37,27,.15);border-radius:8px;padding:16px 20px;margin-top:16px}
.snow-callout h4{color:var(--snow);margin-bottom:6px}
.snow-callout p{font-size:12px;color:var(--text2)}

/* Workflow table */
.wf-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.wf-table th{text-align:left;padding:6px 10px;border-bottom:2px solid var(--border);color:var(--text3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.wf-table td{padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:top}
.wf-table tr:last-child td{border:none}
.wf-table .freq{white-space:nowrap;color:var(--text3);font-size:11px}
.wf-table .pain{color:var(--danger);font-style:italic}

/* Journey */
.journey{display:flex;flex-direction:column;gap:16px;margin-top:8px}
.journey-phase{padding-left:16px;border-left:3px solid var(--border);position:relative}
.journey-phase::before{content:attr(data-label);position:absolute;left:-16px;top:-8px;background:var(--bg);padding:2px 8px;font-size:10px;font-weight:600;color:var(--accent);white-space:nowrap;transform:translateX(-50%)}
.journey-phase ul{list-style:none;margin-top:8px}
.journey-phase li{padding:4px 0;color:var(--text2);font-size:12px}
.journey-phase .jp-pain{color:var(--danger);font-size:11px;font-style:italic;padding:2px 0}

/* Matrix view */
.matrix-wrap{overflow-x:auto;margin-bottom:24px}
.matrix{border-collapse:collapse;width:100%;min-width:900px}
.matrix th,.matrix td{padding:8px 10px;text-align:left;border:1px solid var(--border);font-size:12px}
.matrix th{background:var(--surface2);color:var(--text2);font-weight:600;position:sticky;top:0;z-index:1}
.matrix th:first-child{min-width:140px}
.matrix td:first-child{font-weight:500;color:var(--text);background:var(--surface2);position:sticky;left:0;z-index:1}
.cell{width:56px;height:36px;cursor:pointer;border-radius:4px;transition:all .15s;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:11px}
.cell:hover{transform:scale(1.1);z-index:2}
.cell.s3{background:rgba(22,163,74,.25);color:var(--high)}
.cell.s2{background:rgba(22,163,74,.1);color:rgba(22,163,74,.7)}
.cell.s1{background:rgba(217,119,6,.08);color:rgba(217,119,6,.6)}
.cell.s0{background:transparent;color:var(--text3);opacity:.3}
.pain-name{font-size:11px;max-width:120px;line-height:1.3}
.trend-up{color:var(--high);font-size:10px}
.trend-flat{color:var(--text3);font-size:10px}

/* Drawer */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:100;display:none}
.drawer-overlay.open{display:block}
.drawer{position:fixed;top:0;right:-480px;width:480px;height:100vh;background:var(--surface);border-left:1px solid var(--border);z-index:101;transition:right .2s ease-out;overflow-y:auto;padding:28px}
.drawer.open{right:0}
.drawer-close{position:absolute;top:16px;right:16px;cursor:pointer;color:var(--text3);font-size:20px;background:none;border:none}
.drawer-close:hover{color:var(--text)}
.drawer h3{font-size:16px;font-weight:700;margin-bottom:4px}
.drawer h4{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin:20px 0 8px}
.drawer p{color:var(--text2);font-size:13px;margin-bottom:8px;line-height:1.6}
.evidence-block{background:var(--surface2);border-left:3px solid var(--accent);padding:12px 16px;margin:8px 0;border-radius:0 6px 6px 0}
.evidence-block p{font-size:12px;margin:0}
.snow-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;background:rgba(226,37,27,.08);color:var(--snow);margin-top:4px}

/* Assumptions view */
.assumption-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:0 8px 8px 0;padding:20px 24px;margin-bottom:16px}
.assumption-card .assumption{font-size:14px;font-weight:600;color:var(--text);margin-bottom:10px}
.assumption-card .evidence{color:var(--text2);font-size:13px;margin-bottom:10px;padding:10px 14px;background:rgba(217,119,6,.04);border-radius:6px}
.assumption-card .implication{color:var(--text2);font-size:13px;font-style:italic}

/* Legend */
.legend{display:flex;gap:16px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3)}
.legend-dot{width:14px;height:14px;border-radius:3px}
.legend-dot.s3{background:rgba(22,163,74,.25)}
.legend-dot.s2{background:rgba(22,163,74,.1)}
.legend-dot.s1{background:rgba(217,119,6,.08)}

/* Responsive */
@media(max-width:768px){
  .sidebar{width:60px;min-width:60px}
  .sidebar h1,.nav-item small{display:none}
  .nav-item{padding:10px 0;text-align:center;font-size:16px}
  .main{padding:20px}
  .drawer{width:100vw}
}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <h1>CSP Synthesis</h1>
    <div class="nav-item active" data-view="brief" onclick="showView('brief')">
      Brief<small>5-min prep</small>
    </div>
    <div class="nav-item" data-view="matrix" onclick="showView('matrix')">
      Cross-Reference<small>Pain x Persona</small>
    </div>
    <div class="nav-item" data-view="assumptions" onclick="showView('assumptions')">

    </div>

    <div id="view-brief" class="view active"></div>
    <div id="view-matrix" class="view"></div>
    <div id="view-assumptions" class="view"></div>
  </main>
</div>
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>

// ═══════════════════════════════════════════════
// RENDERING
// ═══════════════════════════════════════════════

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('view-' + id).classList.add('active');
  document.querySelector('[data-view="' + id + '"]').classList.add('active');
  if (id === 'brief') renderBrief();
  if (id === 'matrix') renderMatrix();
  if (id === 'assumptions') renderAssumptions();
}

// ─── BRIEF VIEW ───────────────────────────────
let briefSelection = 'ht-csm';
let briefMode = 'overview'; // overview | workflows | journey

function renderBrief() {
  const el = document.getElementById('view-brief');
  const p = DATA.personas.find(x => x.id === briefSelection);
  const pains = p.top_pains.map(pid => DATA.pain_points.find(pp => pp.id === pid));

  let modeHTML = '';
  if (p.workflows.length || p.journey.length) {
    modeHTML = `
      <div class="mode-toggle">
        <div class="mode-btn${briefMode==='overview'?' active':''}" onclick="briefMode='overview';renderBrief()">Overview</div>
        <div class="mode-btn${briefMode==='workflows'?' active':''}" onclick="briefMode='workflows';renderBrief()">Workflows</div>
        <div class="mode-btn${briefMode==='journey'?' active':''}" onclick="briefMode='journey';renderBrief()">Journey</div>
      </div>`;
  }

  let detailHTML = '';
  if (briefMode === 'workflows') {
    detailHTML = `
      <div class="brief-card">
        <h4>Primary Workflows</h4>
        <table class="wf-table">
          <thead><tr><th>Workflow</th><th>Freq</th><th>Tools</th><th>Key Pain</th></tr></thead>
          <tbody>
            ${p.workflows.map(w => `
              <tr>
                <td><strong>${w.name}</strong></td>
                <td class="freq">${w.freq}</td>
                <td>${w.tools}</td>
                <td class="pain">${w.pain}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  } else if (briefMode === 'journey') {
    detailHTML = `
      <div class="brief-card">
        <h4>${p.journey[0]?.label.includes('Wk') ? '12-Week Implementation' : p.journey[0]?.label.includes('Month') ? 'Typical Quarter' : 'Typical Month'}</h4>
        <div class="journey">
          ${p.journey.map(j => `
            <div class="journey-phase" data-label="${j.label}">
              <ul>
                ${j.items.map(i => `<li>${i}</li>`).join('')}
              </ul>
              ${j.pain ? `<p class="jp-pain">Pain: ${j.pain}</p>` : ''}
            </div>
          `).join('')}
        </div>
      </div>`;
  } else {
    detailHTML = `
      <div class="brief-card">
        <h4>Top Jobs-to-be-Done</h4>
        <ul class="brief-list">
          ${p.top_jtbds.map(j => `<li>${j}</li>`).join('')}
        </ul>
      </div>
      <div class="brief-card">
        <h4>Most Acute Pain Points</h4>
        <ul class="brief-list">
          ${pains.map(pp => `
            <li>
              <strong>${pp.name}</strong> <span class="signal-badge ${pp.signal==='HIGH'?'high':'med'}">${pp.signal}</span>
              <br>${pp.summary}
              <br><span class="stat">${pp.key_stat}</span>
            </li>
          `).join('')}
        </ul>
      </div>`;
  }

  el.innerHTML = `
    <div class="view-header">
      <h2>${p.name}</h2>
      <p>Primary metric: ${p.metric} &nbsp;·&nbsp; Seat count at 500-CSM org: ${p.seats}</p>
    </div>
    <div class="selector">
      ${DATA.personas.map(x => `<div class="chip${x.id===briefSelection?' active':''}" onclick="briefSelection='${x.id}';renderBrief()">${x.short}</div>`).join('')}
    </div>
    ${modeHTML}
    ${detailHTML}
    <div class="snow-callout">
      <h4>ServiceNow Structural Advantage</h4>
      <p>${p.snow_advantage}</p>
    </div>
  `;
}

// ─── MATRIX VIEW ─────────────────────────────
function renderMatrix() {
  const el = document.getElementById('view-matrix');
  const personas = DATA.personas;
  const pains = DATA.pain_points;

  let rows = '';
  for (const pain of pains) {
    const intensities = DATA.matrix[pain.id];
    let cells = '';
    for (const p of personas) {
      const val = intensities[p.id];
      const cls = val >= 3 ? 's3' : val >= 2 ? 's2' : val >= 1 ? 's1' : 's0';
      cells += `<td><div class="cell ${cls}" onclick="openDrawer('${pain.id}','${p.id}')">${val || '–'}</div></td>`;
    }
    const trend = pain.trend === 'up' ? '<span class="trend-up">&#9650;</span>' : '<span class="trend-flat">&#9632;</span>';
    rows += `<tr>
      <td><div class="pain-name">${pain.short} ${trend}</div></td>
      ${cells}
    </tr>`;
  }

  el.innerHTML = `
    <div class="view-header">
      <h2>Pain × Persona Matrix</h2>
      <p>Click any cell to see the JTBD + market evidence. Color intensity = how acutely the persona feels the pain.</p>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot s3"></div> Acutely felt</div>
      <div class="legend-item"><div class="legend-dot s2"></div> Moderate</div>
      <div class="legend-item"><div class="legend-dot s1"></div> Peripheral</div>
      <div class="legend-item"><span class="signal-badge high">HIGH</span> Signal strength</div>
    </div>
    <div class="matrix-wrap">
      <table class="matrix">
        <thead><tr>
          <th>Pain Point</th>
          ${personas.map(p => `<th>${p.short}</th>`).join('')}
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

// ─── DRAWER ───────────────────────────────────
function openDrawer(painId, personaId) {
  const pain = DATA.pain_points.find(p => p.id === painId);
  const persona = DATA.personas.find(p => p.id === personaId);
  const intensity = DATA.matrix[painId][personaId];
  const label = intensity >= 3 ? 'Acutely felt' : intensity >= 2 ? 'Moderate' : intensity >= 1 ? 'Peripheral' : 'Not applicable';
  const relevantJtbds = persona.top_jtbds.filter(j => {
    if (painId === 'pain-1') return j.toLowerCase().includes('data') || j.toLowerCase().includes('tool') || j.toLowerCase().includes('source');
    if (painId === 'pain-3') return j.toLowerCase().includes('health') || j.toLowerCase().includes('score') || j.toLowerCase().includes('risk') || j.toLowerCase().includes('warn');
    if (painId === 'pain-6') return j.toLowerCase().includes('handoff') || j.toLowerCase().includes('context');
    if (painId === 'pain-7') return j.toLowerCase().includes('complex') || j.toLowerCase().includes('config') || j.toLowerCase().includes('self-service');
    if (painId === 'pain-9') return j.toLowerCase().includes('automat') || j.toLowerCase().includes('scale') || j.toLowerCase().includes('playbook');
    if (painId === 'pain-5') return j.toLowerCase().includes('roi') || j.toLowerCase().includes('prove') || j.toLowerCase().includes('report') || j.toLowerCase().includes('value');
    if (painId === 'pain-2') return j.toLowerCase().includes('ai') || j.toLowerCase().includes('predict');
    if (painId === 'pain-4') return j.toLowerCase().includes('time') || j.toLowerCase().includes('capacity') || j.toLowerCase().includes('cover');
    if (painId === 'pain-8') return j.toLowerCase().includes('metric') || j.toLowerCase().includes('measur') || j.toLowerCase().includes('renewal');
    if (painId === 'pain-10') return j.toLowerCase().includes('value') || j.toLowerCase().includes('outcome') || j.toLowerCase().includes('roi');
    return false;
  });

  document.getElementById('drawer').innerHTML = `
    <button class="drawer-close" onclick="closeDrawer()">&times;</button>
    <h3>${pain.name}</h3>
    <p style="margin-top:4px"><span class="signal-badge ${pain.signal==='HIGH'?'high':'med'}">${pain.signal} SIGNAL</span> &nbsp; ${pain.trend === 'up' ? 'Trending up' : 'Stable'}</p>
    <h4>${persona.short} Impact: ${label}</h4>
    <p>${pain.summary}</p>
    <h4>Market Evidence</h4>
    <div class="evidence-block"><p>${pain.evidence}</p></div>
    ${relevantJtbds.length ? `
      <h4>Related JTBDs for ${persona.short}</h4>
      <ul class="brief-list">
        ${relevantJtbds.map(j => `<li>${j}</li>`).join('')}
      </ul>
    ` : ''}
    ${persona.snow_advantage ? `
      <h4>ServiceNow Advantage</h4>
      <div class="snow-tag">SNOW</div>
      <p>${persona.snow_advantage}</p>
    ` : ''}
  `;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('open');
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
}

// ─── ASSUMPTIONS VIEW ─────────────────────────
function renderAssumptions() {
  const el = document.getElementById('view-assumptions');
  el.innerHTML = `
    <div class="view-header">
      <h2>Disconfirming Evidence</h2>
      <p>Things that challenge common assumptions about the CS platform market. Read these before anchoring on a strategy.</p>
    </div>
    ${DATA.assumptions.map((a,i) => `
      <div class="assumption-card">
        <div class="assumption">${i+1}. ${a.assumption}</div>
        <div class="evidence"><strong>Evidence:</strong> ${a.evidence}</div>
        <div class="implication"><strong>Implication:</strong> ${a.implication}</div>
      </div>
    `).join('')}
  `;
}

// ─── INIT ─────────────────────────────────────
renderBrief();
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
